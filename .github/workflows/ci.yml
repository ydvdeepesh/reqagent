name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  kind:
    # Build the image, run it on a throwaway Kubernetes cluster, and call the API.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reqagent:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - run: kind load docker-image reqagent:ci --name ci
      - run: |
          kubectl apply -f deploy/k8s/
          kubectl set image deployment/reqagent reqagent=reqagent:ci
          kubectl rollout status deployment/reqagent --timeout=180s
      - name: Smoke test
        run: |
          kubectl port-forward service/reqagent 8080:80 &
          sleep 5
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/analyze -H 'Content-Type: application/json' \
            -d '{"content": "The pump shall be fast.", "rules_only": true}' | tee out.json
          grep -q '"VAGUE"' out.json
      - if: failure()
        run: kubectl describe pods; kubectl logs deployment/reqagent --tail=100

  publish:
    # Push the image to GHCR on main only.
    needs: kind
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
