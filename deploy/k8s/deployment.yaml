apiVersion: apps/v1
kind: Deployment
metadata:
  name: reqagent
  labels: {app: reqagent}
spec:
  replicas: 1
  selector:
    matchLabels: {app: reqagent}
  template:
    metadata:
      labels: {app: reqagent}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: reqagent
          image: ghcr.io/ydvdeepesh/reqagent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            # kubectl create secret generic reqagent-secrets --from-env-file=.env
            - secretRef: {name: reqagent-secrets, optional: true}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
