[project]
name = "reqagent"
version = "0.1.0"
description = "Reviews natural-language requirements: quality smells, duplicates, conflicts, SysML v2 export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reqagent = "reqagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
